## Ansible 主机清单示例文件
## 使用前请根据实际环境修改服务器地址和分组

# ============================================
# Web 服务器组
# ============================================
[web_servers]
web01.example.com ansible_host=192.168.1.10
web02.example.com ansible_host=192.168.1.11

# ============================================
# 应用服务器组
# ============================================
[app_servers]
app01.example.com ansible_host=192.168.1.20
app02.example.com ansible_host=192.168.1.21
app03.example.com ansible_host=192.168.1.22

# ============================================
# 数据库服务器组
# ============================================
[db_servers]
db01.example.com ansible_host=192.168.1.30
db02.example.com ansible_host=192.168.1.31

# ============================================
# 所有服务器组（包含以上所有）
# ============================================
[all_servers:children]
web_servers
app_servers
db_servers

# ============================================
# 按操作系统分组示例
# ============================================
[centos_servers]
web01.example.com
app01.example.com
db01.example.com

[ubuntu_servers]
web02.example.com
app02.example.com
app03.example.com
db02.example.com

# ============================================
# 主机变量配置示例
# ============================================
[all_servers:vars]
# SSH 连接用户
ansible_user=root
# SSH 端口（如果非默认 22）
# ansible_port=22
# 是否需要 sudo
# ansible_become=true
# ansible_become_method=sudo

# ============================================
# 单台服务器配置示例
# ============================================
# [test_servers]
# server01 ansible_host=10.0.0.10 ansible_user=admin ansible_port=2222
# server02 ansible_host=10.0.0.11 ansible_user=root

# ============================================
# 使用说明：
# ============================================
# 1. 确保已配置 SSH 免密登录到所有目标服务器
# 2. 将实际服务器 IP/主机名替换示例中的地址
# 3. 根据需要调整分组
# 4. 运行命令: ansible-playbook -i inventory/hosts.ini playbooks/server_inspection.yml
